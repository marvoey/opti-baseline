<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 290 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Specialty Food Association">
  <!-- Circular emblem -->
  <circle cx="26" cy="26" r="24" fill="#2E9791"/>
  <circle cx="26" cy="26" r="19.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.75"/>
  <!-- Emblem inner text -->
  <text x="26" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.8)">SPECIALTY</text>
  <line x1="10" y1="22.5" x2="42" y2="22.5" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <text x="26" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="white">FOOD</text>
  <text x="26" y="43" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="600" letter-spacing="2" fill="rgba(255,255,255,0.65)">ASSOC.</text>
  <!-- Wordmark -->
