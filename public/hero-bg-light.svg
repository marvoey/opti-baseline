<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="l-glow" cx="80%" cy="15%" r="45%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c9e6df" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4f2ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base stone -->
  <rect width="1440" height="540" fill="#f4f2ec"/>

  <!-- Mint wash top-right -->
  <rect width="1440" height="540" fill="url(#l-glow)"/>

  <!-- Large mint circles anchored top-right -->
  <circle cx="1300" cy="80"  r="380" fill="#c9e6df" fill-opacity="0.35"/>
  <circle cx="1300" cy="80"  r="270" fill="#6fc8b9" fill-opacity="0.18"/>

  <!-- Diagonal teal band SW corner -->
  <polygon points="0,540 0,360 820,0 1040,0" fill="#c9e6df" fill-opacity="0.28"/>

  <!-- Concentric arcs anchored bottom-left corner -->
  <circle cx="0" cy="540" r="200" fill="none" stroke="#6fc8b9" stroke-width="1"   opacity="0.22"/>
  <circle cx="0" cy="540" r="320" fill="none" stroke="#4fb0ad" stroke-width="1"   opacity="0.16"/>
  <circle cx="0" cy="540" r="440" fill="none" stroke="#4fb0ad" stroke-width="0.5" opacity="0.10"/>

  <!-- Geometric accent — diamond mid-left -->
  <polygon points="120,200 200,120 280,200 200,280" fill="#4fb0ad" fill-opacity="0.15"/>
  <polygon points="140,220 200,140 260,220 200,300" fill="none" stroke="#1c919b" stroke-width="1.5" opacity="0.20"/>

  <!-- Gold accent diagonals -->
  <line x1="400"  y1="540" x2="1440" y2="100" stroke="#a29060" stroke-width="1.5" opacity="0.25"/>
  <line x1="300"  y1="540" x2="1340" y2="100" stroke="#a29060" stroke-width="0.5" opacity="0.12"/>
</svg>
