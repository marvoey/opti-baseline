<style>
body{font-family:Roboto,Helvetica,Arial,sans-serif;color:#343741}
.accent{width:44px;height:4px;background:#FFD000;border-radius:2px}
/* controller window (?controller) */
body.ctl{background:#111;padding:0}
body.ctl .page,body.ctl template{display:none!important}
.tabbtn{display:block;width:100%;text-align:left;font-size:13px;font-weight:500;color:rgba(255,255,255,.8);padding:8px 14px;border-radius:9999px;white-space:nowrap}
.tabbtn:hover{background:rgba(255,255,255,.08)}
.tabbtn:disabled,#agentSel:disabled{opacity:.4;cursor:not-allowed}
.tabbtn.active{background:#FFD000;color:#1A1446}
.tg{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:18px 14px 6px;white-space:nowrap}
.page{display:none}.page.active{display:block}
a.lk,button.lk{color:#06748C;text-decoration:underline;text-underline-offset:2px}
ins{text-decoration:none}
.fr{scrollbar-gutter:stable}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.mk-av{background:linear-gradient(135deg,#1A1446 0%,#06748C 100%);box-shadow:0 0 0 0 rgba(6,116,140,.45);animation:mkPulse 1.8s ease-out infinite}
@keyframes mkPulse{0%{box-shadow:0 0 0 0 rgba(6,116,140,.45)}70%{box-shadow:0 0 0 12px rgba(6,116,140,0)}100%{box-shadow:0 0 0 0 rgba(6,116,140,0)}}
.mk-card{animation:mkCard .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes mkCard{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mk-spin{animation:mkSpin .8s linear infinite}
@keyframes mkSpin{to{transform:rotate(360deg)}}
.mk-pop{animation:mkPop .38s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes mkPop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
.mk-in{animation:mkIn .35s ease both}
@keyframes mkIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.mk-txt{display:inline-block;animation:mkFade .3s ease both}
@keyframes mkFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mk-dots i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:#06748C;vertical-align:middle;animation:mkDot 1.2s infinite ease-in-out}
.mk-dots i:nth-child(2){animation-delay:.15s}.mk-dots i:nth-child(3){animation-delay:.3s}
@keyframes mkDot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.prow{transition:box-shadow .2s ease,background .6s ease}
.prow.flash{animation:rowFlash 1.6s ease}
@keyframes rowFlash{0%{background:#FFF8DB;box-shadow:0 0 0 4px rgba(255,208,0,.6);transform:translateY(-6px)}60%{transform:none}100%{background:#fff;box-shadow:none}}
.th-new{animation:mkPop .45s cubic-bezier(.2,.9,.3,1.3) both}
.disc-new{animation:discGlow 1.8s ease 1}
@keyframes discGlow{0%{box-shadow:0 0 0 0 rgba(255,208,0,0)}25%{box-shadow:0 0 0 8px rgba(255,208,0,.45)}100%{box-shadow:0 0 0 0 rgba(255,208,0,0)}}
.gd-back{animation:gdFade .25s ease both}
@keyframes gdFade{from{opacity:0}to{opacity:1}}
.gd-step:hover{border-color:#06748C}
.upd{animation:updPulse 1.4s ease 1}
@keyframes updPulse{0%{box-shadow:0 0 0 0 rgba(6,116,140,0)}30%{box-shadow:0 0 0 6px rgba(6,116,140,.28)}100%{box-shadow:0 0 0 0 rgba(6,116,140,0)}}
/* ---- Liberty Mutual FloatingHeader (values from libertymutual.com #FloatingHeader_lmWrapper__Qjvhn) ---- */
.lmig-FloatingHeader{--lmig-FloatingHeader-height:56px;--lmig-FloatingHeader-margin-top:12px;--lmig-FloatingHeader-font-color:#343741;--lmig-FloatingHeader-box-shadow:0 8px 12px -6px rgba(0,0,0,0.04),0 6px 4px -1px rgba(0,0,0,0.04),0 4px 6px -2px rgba(0,0,0,0.08);--lmig-FloatingHeader-brand-color:#FFD000;--lmig-FloatingHeader-background-color:rgba(255,255,255,0.85);font-family:Roboto,Arial,sans-serif;box-sizing:border-box;max-width:100%;margin:var(--lmig-FloatingHeader-margin-top) 0 0;position:relative;z-index:30}
.lmig-FloatingHeader *{box-sizing:inherit}

.lmig-FloatingHeader.jsx-1677250985{margin-bottom:1.5rem}
.lmig-FloatingHeader-actions,.lmig-FloatingHeader-inner{display:flex;flex-direction:row}
.lmig-FloatingHeader-inner{background-color:var(--lmig-FloatingHeader-background-color);backdrop-filter:blur(8px);height:var(--lmig-FloatingHeader-height);padding-right:.5rem;border-radius:16px;box-shadow:var(--lmig-FloatingHeader-box-shadow);position:relative}
.lmig-FloatingHeader-brand{order:0;flex:0 0 116px;display:flex;align-self:stretch;align-items:center;justify-content:center;border-top-left-radius:inherit;border-bottom-left-radius:inherit;background-color:var(--lmig-FloatingHeader-brand-color)}
.lmig-FloatingHeader-brand-logo{flex:0 0 88px}
.lmig-FloatingHeader-nav{display:none;flex-direction:row;order:1;flex:1 auto;margin-left:1rem;align-items:center}
.lmig-FloatingHeader-nav-menu{display:flex;gap:1.25rem;padding:0;margin:0}
.lmig-FloatingHeader-nav-menu a{color:#1A1446}
.lmig-FloatingHeader-actions{order:2;flex:0 0 auto;align-items:center;margin-left:.25rem;gap:.25rem}
.lmig-FloatingHeader .lmig-FloatingHeader-actions a{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:700;color:#1A1446;justify-content:center;min-width:40px;min-height:40px}
/* ---- mobile-first header: base = phones; full nav + large brand from lg (1024px) ---- */
.lm-lbl{display:none}
.lm-sm-up{display:none!important}
.lm-menu-btn{order:3;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:44px;height:44px;border-radius:9999px;color:#1A1446;background:transparent;border:0;cursor:pointer}
.lm-menu-btn:hover{background:rgba(26,20,70,.06)}
.lm-menu-btn .lm-ic-close,.lm-menu-btn[aria-expanded="true"] .lm-ic-open{display:none}
.lm-menu-btn[aria-expanded="true"] .lm-ic-close{display:block}
.lm-menu-btn:focus-visible,.lmig-FloatingHeader a:focus-visible{outline:2px solid #06748C;outline-offset:2px}
.lm-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);padding:.5rem;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(26,20,70,.18);z-index:50}
.lm-panel.open{display:flex;flex-direction:column}
.lm-panel a{display:flex;align-items:center;gap:.5rem;min-height:48px;padding:0 1rem;border-radius:12px;font-size:1rem;font-weight:500;color:#1A1446}
.lm-panel a:hover{background:#F5F5F5}
.lm-panel a.is-active{box-shadow:inset 4px 0 0 #FFD000;font-weight:700}
.lm-footbrand .lmig-FloatingHeader-brand{flex:1 1 100%}
.lm-footbrand .lmig-FloatingHeader-brand-logo{flex:0 0 157px}
@media (min-width:640px){
.lm-lbl{display:inline}
.lm-sm-up{display:flex!important}
.lmig-FloatingHeader .lmig-FloatingHeader-actions a{min-width:0;min-height:0;padding:0}
}
@media (min-width:1024px){
.lmig-FloatingHeader{--lmig-FloatingHeader-height:80px;--lmig-FloatingHeader-margin-top:32px}
.lmig-FloatingHeader-inner{padding-right:2rem;border-radius:24px}
.lmig-FloatingHeader-brand{flex-basis:221px}
.lmig-FloatingHeader-brand-logo{flex-basis:157px}
.lmig-FloatingHeader-nav{display:flex;margin-left:2rem}
.lmig-FloatingHeader-actions{margin-left:2rem;gap:1.25rem}
.lm-menu-btn,.lm-panel{display:none!important}
}
@media (min-width:1280px){.lmig-FloatingHeader-nav-menu{gap:2rem}}

/* Liberty Mutual logo component */
.lmig-Logo{font-family:Roboto,Arial,sans-serif;box-sizing:border-box;--lmig-Logo-medallion-fill-color:#FFFFFF;--lmig-Logo-medallion-stroke-color:none;--lmig-Logo-medallion-stroke-width:1.5;--lmig-Logo-path-fill-color:#1A1446;display:block;position:relative;line-height:0}
.lmig-Logo *{box-sizing:inherit}
.lmig-Logo .lmig-Logo--dark{display:none}
.lmig-Logo>svg{width:100%;max-width:100%;padding:0;height:1px;overflow:visible;box-sizing:content-box}
.lmig-LogoLibertyMutual--blue .lmig-Logo--medallionFill{stroke:var(--lmig-Logo-medallion-stroke-color);stroke-width:var(--lmig-Logo-medallion-stroke-width);fill:var(--lmig-Logo-medallion-fill-color)}
.lmig-LogoLibertyMutual--blue .lmig-Logo--path{fill:var(--lmig-Logo-path-fill-color)}

</style>

 <div class="px-8 pt-7 pb-5 border-b border-gray-100 flex items-start gap-4">
  <span class="w-11 h-11 shrink-0 rounded-full bg-lmy text-navy text-xl font-bold flex items-center justify-center">?</span>
  <div class="flex-1 min-w-0"><div class="text-[11px] font-bold tracking-[.14em] uppercase text-lmt">Independent Agent Portal mockup</div><h2 id="gdTitle" class="text-[26px] leading-tight font-light text-navy">How to use this mockup</h2><p class="mt-1 text-sm text-gray-600">A clickable walkthrough of the agent portal use case. Everything is simulated, and changes you make carry across screens.</p></div>
  <button onclick="closeGuide()" aria-label="Close" class="shrink-0 w-9 h-9 rounded-full border border-gray-200 text-gray-500 hover:border-lmt hover:text-lmt flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 </div>
 <div class="flex-1 overflow-y-auto px-8 py-6">
  <div class="text-xs font-bold tracking-wider uppercase text-gray-500">Keyboard shortcuts</div>
  <div class="mt-3 grid sm:grid-cols-2 gap-3">
   <div class="rounded-xl border border-gray-200 p-4 flex gap-4 items-start"><kbd class="inline-flex items-center justify-center min-w-[28px] h-7 px-2 rounded-md border border-gray-300 bg-white text-navy text-sm font-bold shadow-[0_1px_0_rgba(0,0,0,.12)]">S</kbd><div><div class="font-medium text-navy">Open the controller window</div><p class="mt-1 text-sm leading-6 text-gray-600">Press <b>S</b> on the mockup page. A small window opens with every tab, the Agent menu and Reset, and clicking there drives the mockup. Press <b>S</b> again to bring it back to the front.</p></div></div>
   <div class="rounded-xl border border-gray-200 p-4 flex gap-4 items-start"><kbd class="inline-flex items-center justify-center min-w-[28px] h-7 px-2 rounded-md border border-gray-300 bg-white text-navy text-sm font-bold shadow-[0_1px_0_rgba(0,0,0,.12)]">H</kbd><div><div class="font-medium text-navy">Open this guide</div><p class="mt-1 text-sm leading-6 text-gray-600">Press <b>H</b> in either window and the guide opens in the window you are in. Press <b>H</b> or <b>Esc</b> to close it.</p></div></div>
  </div>
  <p class="mt-2 text-xs text-gray-500">Shortcuts are ignored while you are typing in a field, such as the email box on Sign in.</p>
  <div class="mt-8 text-xs font-bold tracking-wider uppercase text-gray-500">The controller window, top to bottom</div>
  <div class="mt-3 grid sm:grid-cols-3 gap-3">${GUIDE_LENSES.map(([t,d,s])=>`<div class="rounded-xl bg-mist p-4"><div class="font-medium text-navy">${t}</div><div class="mt-1 text-xs text-gray-600 leading-5">${d}</div><div class="mt-2 text-[11px] font-medium text-lmtd">${s}</div></div>`).join('')}</div>
  <div class="mt-8 text-xs font-bold tracking-wider uppercase text-gray-500">Suggested walkthrough</div>
  <ol class="mt-3 space-y-3">${GUIDE_STEPS.map(([t,d,l,f],i)=>`<li class="gd-step flex gap-4 rounded-xl border border-gray-200 p-4 transition-colors"><span class="w-7 h-7 shrink-0 rounded-full bg-navy text-white text-sm font-medium flex items-center justify-center">${i+1}</span><div class="flex-1 min-w-0"><div class="font-medium text-navy">${t}</div><p class="mt-1 text-sm leading-6 text-gray-600">${d}</p></div><button onclick="guideGo('${f}')" class="self-center shrink-0 text-sm font-medium text-lmt hover:text-lmtd whitespace-nowrap">${l} ›</button></li>`).join('')}</ol>
  <div class="mt-8 text-xs font-bold tracking-wider uppercase text-gray-500">Good to know</div>
  <ul class="mt-3 space-y-3 text-sm leading-6 text-gray-700">
   <li class="flex gap-3">${CHECK}<span><b class="text-navy">Two windows.</b> Keep the controller beside the mockup, or on a second screen, so the audience only sees the mockup.</span></li>
   <li class="flex gap-3">${CHECK}<span><b class="text-navy">Agent menu</b> (bottom of the controller window). On Sign in, Dashboard and Product page it changes who you are. On the other tabs it sets who opens when you choose “Open dashboard”.</span></li>
   <li class="flex gap-3">${CHECK}<span><b class="text-navy">↺ Reset</b> returns every screen to where it started, so you can run the walkthrough again.</span></li>
   <li class="flex gap-3">${CHECK}<span><b class="text-navy">Different people, different screens.</b> The business screens are used by Priya (marketing), Devon (design system) and Jordan, Maria and Sam (content, compliance, publishing).</span></li>
   <li class="flex gap-3">${CHECK}<span>The Content Studio screens are an illustration of the authoring tool. Names, resources, dates and disclosure wording are placeholders.</span></li>
   <li class="flex gap-3">${CHECK}<span>Open this guide any time by pressing <b class="text-navy">H</b>, or with <b class="text-navy">How to use this mockup</b> in the controller window.</span></li>
  </ul>
 </div>
 <div class="px-8 py-4 border-t border-gray-100 bg-[#FAFAFA] flex flex-wrap items-center justify-between gap-3"><span class="text-xs text-gray-500">8 steps · about 5 minutes</span><div class="flex gap-3"><button onclick="closeGuide()" class="border border-gray-300 bg-white hover:border-lmt rounded-md px-5 py-2.5 text-sm font-medium text-navy">Close</button><button onclick="guideGo('go(0)')" class="bg-lmt hover:bg-lmtd text-white rounded-md px-5 py-2.5 text-sm font-medium">Start with step 1</button></div></div>
</div></div></div>`}
function openGuide(){const g=$('#guide');if(!g)return;g.classList.remove('hidden');document.documentElement.style.overflow='hidden';const b=$('#guide button[aria-label="Close"]');if(b)b.focus();$('#guide .overflow-y-auto').scrollTop=0}
function closeGuide(){const g=$('#guide');if(!g||g.classList.contains('hidden'))return;g.classList.add('hidden');document.documentElement.style.overflow='';const b=$('#helpBtn');if(b)b.focus()}
function toggleGuide(){const g=$('#guide');if(g&&!g.classList.contains('hidden'))closeGuide();else openGuide()}
/* guide buttons only ever navigate to a tab: 'go(n)'. In the controller window that means telling the mockup window. */
function guideGo(fn){closeGuide();const m=/^go\((\d+)\)$/.exec(fn);if(!m)return;const i=+m[1];if(IS_CTL)ctlGo(i);else go(i)}
if(IS_CTL)ctlBoot();
else{
 document.body.insertAdjacentHTML('beforeend',guideHTML());
 window.addEventListener('message',onCtlMessage);
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeGuide();
  const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
  const plain=!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&!typing,k=e.key.toLowerCase();
  if(plain&&k==='s'){e.preventDefault();openCtl()}
  else if(plain&&k==='h'){e.preventDefault();toggleGuide()}
 });
 if(AUTO_OPEN_GUIDE)openGuide();
}
</script>
</body>
</html>
