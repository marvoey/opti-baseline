<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="t d">
  <title id="t">A browser address bar with the address of a CMS</title>
  <desc id="d">The address bar shows https://app-xxxxxxxx.cms.optimizely.com followed by /ui/Credentials/Credentials. The first part, up to and including .cms.optimizely.com, is highlighted and labelled Keep this part. The rest is labelled Delete this part.</desc>
  <rect x="24" y="18" width="712" height="52" rx="26" fill="#ffffff" stroke="#08251a" stroke-width="2"/>
  <rect x="50" y="40" width="14" height="11" rx="2" fill="#08251a"/>
  <path d="M53 40 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#08251a" stroke-width="2"/>
  <rect x="87" y="32" width="362" height="24" rx="6" fill="#abff44"/>
  <text x="92" y="49" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#08251a" textLength="352" lengthAdjust="spacing">https://app-xxxxxxxx.cms.optimizely.com</text>
  <text x="452" y="49" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#6b7a72" textLength="244" lengthAdjust="spacing">/ui/Credentials/Credentials</text>
  <path d="M92 84 v10 h348 v-10" fill="none" stroke="#08251a" stroke-width="2.5"/>
  <text x="266.0" y="123" text-anchor="middle" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#08251a">Keep this part</text>
  <text x="266.0" y="145" text-anchor="middle" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#08251a">your CMS’s address</text>
  <path d="M452 84 v10 h244 v-10" fill="none" stroke="#8a968f" stroke-width="2.5"/>
  <text x="574.0" y="123" text-anchor="middle" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4a5a52">Delete this part</text>
  <text x="574.0" y="145" text-anchor="middle" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4a5a52">it isn’t needed (yours may differ)</text>
</svg>
