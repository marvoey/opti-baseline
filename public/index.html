<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Coop | Team Intranet</title>
<style>
:root{--red:#e51636;--red-d:#b80f2a;--ink:#1d1d1f;--mut:#6b6b73;--line:#e6e6ea;--bg:#f6f4f1;--card:#fff;--cream:#fff8ef;--ok:#1a8a4a;--warn:#c77700;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:var(--red)}
header.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff}
.brand small{font-weight:500;font-size:12px;opacity:.85;display:block;line-height:1}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:600;opacity:.92}
nav.main a:hover{background:rgba(255,255,255,.18)}
nav.main a.active{background:#fff;color:var(--red);opacity:1}
.search{margin-left:auto;position:relative}
.search input{border:0;border-radius:999px;padding:9px 16px;width:250px;font-size:14px;outline:none}
.results{position:absolute;right:0;top:44px;background:#fff;color:var(--ink);width:380px;max-height:420px;overflow:auto;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:none}
.results.show{display:block}
.results h6{margin:0;padding:10px 14px 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.6px}
.results div.it{padding:9px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}
.results div.it:hover{background:var(--cream)}
.results div.it small{color:var(--mut);display:block}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.page-title h1{margin:4px 0 2px;font-size:30px;letter-spacing:-.5px}
.page-title p{margin:0 0 20px;color:var(--mut)}
.hero{background:linear-gradient(120deg,var(--red),#ff4d67);color:#fff;border-radius:20px;padding:34px 36px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h2{margin:0 0 6px;font-size:32px;letter-spacing:-.5px}
.hero p{margin:0 0 14px;max-width:620px;opacity:.95}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--red);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{background:var(--red-d)}
.btn.light{background:#fff;color:var(--red)}
.btn.ghost{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
section.blk{margin-bottom:28px}
section.blk>h3{font-size:20px;margin:0 0 12px;letter-spacing:-.3px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.click{cursor:pointer;transition:.15s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.tile{display:flex;align-items:center;gap:12px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.15s}
.tile:hover{border-color:var(--red);transform:translateY(-2px)}
.tile .ic{font-size:26px;background:var(--cream);width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:999px;background:#fde8ec;color:var(--red)}
.tag.menu{background:#fff1d6;color:#9a5b00}.tag.people{background:#e8f0ff;color:#2a56c6}.tag.operations{background:#e6f6ec;color:var(--ok)}.tag.community{background:#f1e8ff;color:#6a3bc4}.tag.company{background:#fde8ec;color:var(--red)}
.tag.training{background:#e8f0ff;color:#2a56c6}.tag.safety{background:#fde8ec;color:var(--red)}.tag.policy{background:#eee;color:#444}.tag.hr{background:#fff1d6;color:#9a5b00}.tag.brand{background:#e6f6ec;color:var(--ok)}
.tag.celebration{background:#fff1d6;color:#9a5b00}
.card h4{margin:10px 0 6px;font-size:17px;line-height:1.3}
.card p{margin:0;color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select,.f input,.f select,.f textarea{padding:10px 12px;border:1px solid #cfcfd6;border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.bar input{flex:1;min-width:220px}
.person{display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.av.big{width:84px;height:84px;font-size:28px}
.person b{display:block}.person small{color:var(--mut)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:22px}

.quote{background:var(--cream);border-left:5px solid var(--red);padding:16px 20px;border-radius:10px;margin-bottom:14px;font-style:italic}
.quote b{display:block;font-style:normal;margin-top:6px;color:var(--mut);font-size:13px}
.shout{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.shout:last-child{border:0}
.shout .av{width:40px;height:40px;font-size:14px}
.shout small{color:var(--mut)}
.f{display:grid;gap:12px}
.f label{font-size:13px;font-weight:700;display:grid;gap:5px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.5px}
.st{font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.st.Pending{background:#fff1d6;color:var(--warn)}.st.Approved{background:#e6f6ec;color:var(--ok)}
.stat{font-size:34px;font-weight:800;letter-spacing:-1px}
.prog{height:8px;background:#ececf0;border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{background:#fafafa;text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:8px 0}
.cal .d{background:#fff;min-height:92px;padding:5px;font-size:12px}
.cal .d.out{background:#fafafa;color:#b5b5bd}
.cal .d.sun{background:#fbf5f5}
.cal .d.today .n{background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal .d small{display:block;color:#c9a0a8;font-size:10px}
.ev{display:block;font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;margin-top:3px;cursor:pointer;background:#fde8ec;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.training{background:#e8f0ff;color:#2a56c6}.ev.community{background:#f1e8ff;color:#6a3bc4}.ev.celebration{background:#fff1d6;color:#9a5b00}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h4{margin:0;font-size:18px}
.evrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.evrow:last-child{border:0}
.date{background:var(--cream);border-radius:12px;width:56px;text-align:center;padding:6px 0;flex:none}
.date b{display:block;font-size:20px;line-height:1.1}.date small{font-size:11px;text-transform:uppercase;color:var(--red);font-weight:700}
.past{opacity:.55}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:28px;position:relative}
.modal .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--mut)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%);opacity:1}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--mut);font-size:12px}
.srcbadge{display:inline-block;background:#fff;border:1px dashed #bbb;border-radius:8px;padding:4px 10px;margin-bottom:6px}
.empty{color:var(--mut);padding:20px;text-align:center}
</style>
</head>

function shoutsHtml(){return S.shouts.map(s=>`<div class="shout"><div class="av">${initials(s.to)}</div><div><b>${esc(s.to)}</b> <small>from ${esc(s.from)} · ${esc(s.when)}</small><div>${esc(s.msg)}</div></div></div>`).join('');}

R.CfaEventsSection=(p)=>{
  const evs=(p.Events||[]).map(props);
  const now=todayUTC();
  const sorted=[...evs].sort((a,b)=>new Date(a.StartDate)-new Date(b.StartDate));
  const list=p.ShowCalendarGrid?sorted:sorted.filter(e=>new Date(e.StartDate).getTime()>=now);
  const rows=list.map(e=>{const i=REG.events.findIndex(x=>x.Title===e.Title&&x.StartDate===e.StartDate);const past=new Date(e.StartDate).getTime()<now;
    return `<div class="evrow ${past?'past':''}" data-act="event" data-v="${i}"><div class="date"><small>${fmtDate(e.StartDate,{month:'short'})}</small><b>${fmtDate(e.StartDate,{day:'numeric'})}</b></div><div style="flex:1"><b>${esc(e.Title)}</b><div style="color:var(--mut);font-size:13px">${fmtTime(e.StartDate)} · ${esc(e.EventLocation)}${past?' · Past':''}</div></div><span class="tag ${e.EventType}">${esc(ETYPE[e.EventType]||e.EventType)}</span></div>`}).join('')||'<div class="empty">No upcoming events.</div>';
  if(!p.ShowCalendarGrid) return `<section class="blk"><h3${ed('Heading')}>${esc(p.Heading)}</h3><div class="card">${rows}<div style="margin-top:12px"><a class="btn ghost sm" href="#/events">View full calendar</a></div></div></section>`;
  return `<section class="blk"><h3${ed('Heading')}>${esc(p.Heading)}</h3><div class="row2"><div class="card" id="calwrap">${calHtml(evs)}</div><div class="card"><b>All events</b><div style="margin-top:6px">${rows}</div><div style="margin-top:14px"><button class="btn sm" data-act="addevent">+ Add event</button></div></div></div></section>`;
};
function calHtml(evs){
  if(!S.cal){const n=new Date();S.cal=new Date(Date.UTC(n.getFullYear(),n.getMonth(),1));}
  const y=S.cal.getUTCFullYear(),m=S.cal.getUTCMonth(),first=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),now=todayUTC();
  let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div class="d out"></div>';
  for(let d=1;d<=dim;d++){const t=Date.UTC(y,m,d),dow=new Date(t).getUTCDay();
    const es=evs.filter(e=>{const x=new Date(e.StartDate);return x.getUTCFullYear()===y&&x.getUTCMonth()===m&&x.getUTCDate()===d});
    cells+=`<div class="d ${dow===0?'sun':''} ${t===now?'today':''}"><span class="n">${d}</span>${dow===0?'<small>Closed</small>':''}${es.map(e=>`<span class="ev ${e.EventType}" data-act="event" data-v="${REG.events.findIndex(x=>x.Title===e.Title&&x.StartDate===e.StartDate)}">${esc(e.Title)}</span>`).join('')}</div>`;}
  return `<div class="cal-h"><button class="btn ghost sm" data-act="calprev">&larr;</button><h4>${S.cal.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})}</h4><button class="btn ghost sm" data-act="calnext">&rarr;</button></div><div class="cal">${cells}</div>`;
}

/* ---------- registry (for search, modals) ---------- */
function buildRegistry(){
  REG={news:[],people:[],docs:[],events:[]};
  const all=[SITE.home,...SITE.pages];
  all.forEach(pg=>(pg.nodes||[]).forEach(n=>{const p=props(n);
    (p.Articles||[]).map(props).forEach(a=>{if(!REG.news.find(x=>x.Headline===a.Headline))REG.news.push(a)});
    (p.People||[]).map(props).forEach(a=>{if(!REG.people.find(x=>x.FullName===a.FullName))REG.people.push(a)});
    (p.Documents||[]).map(props).forEach(a=>{if(!REG.docs.find(x=>x.Title===a.Title))REG.docs.push(a)});
    (p.Events||[]).map(props).forEach(a=>{if(!REG.events.find(x=>x.Title===a.Title&&x.StartDate===a.StartDate))REG.events.push(a)});
  }));
}

/* ---------- router ---------- */
function route(){
  const raw=location.hash.replace(/^#\/?/,''); const [path,qs]=raw.split('?'); const seg=path||'';
  if(qs){const u=new URLSearchParams(qs); if(u.get('type'))S.resType=u.get('type');}
  const isHome=seg==='';
  const pg=isHome?SITE.home:SITE.pages.find(p=>p.routeSegment===seg);
  const nav=[...SITE.pages].filter(p=>props(p).ShowInNavigation!==false).sort((a,b)=>props(a).NavOrder-props(b).NavOrder);
  $('#nav').innerHTML=`<a href="#/" class="${isHome?'active':''}">Home</a>`+nav.map(p=>`<a href="#/${p.routeSegment}" class="${p.routeSegment===seg?'active':''}">${esc(props(p).PageIcon||'')} ${esc(p.displayName)}</a>`).join('');
  const app=$('#app');
  if(!pg){app.innerHTML='<div class="empty">Page not found. <a href="#/">Back home</a></div>';return;}
  const hp=props(SITE.home); const ctx={home:hp};
  // On-page editing only applies to the exact item being previewed (not other pages reached via the nav).
  EDITING=!!(PV&&PV.ctx==='edit'&&SITE.preview&&pg.key===SITE.preview.key);
  const sn=$('#siteNameText'),rn=$('#restName');
  if(EDITING&&isHome){sn.setAttribute('data-epi-edit','SiteName');rn.setAttribute('data-epi-edit','RestaurantName');}
  else{sn.removeAttribute('data-epi-edit');rn.removeAttribute('data-epi-edit');}
  let html='';
  if(!isHome){const pp=props(pg);html+=`<div class="page-title"><h1>${esc(pp.PageIcon||'')} ${esc(pg.displayName)}</h1><p${ed('PageIntro')}>${esc(pp.PageIntro||'')}</p></div>`;}
  const nodes=pg.nodes||[];
  if(isHome){ // home: two column layout for news + recognition/events
    const get=t=>nodes.filter(n=>n.contentType===t).map(n=>tagBlock(R[t](props(n),ctx),n)).join('');
    html+=get('CfaHeroBanner')+get('CfaQuickLinksSection')+`<div class="row2"><div>${get('CfaNewsListSection')}</div><div>${get('CfaEventsSection')}</div></div>`+get('CfaRecognitionSection');
  } else html+=nodes.map(n=>R[n.contentType]?tagBlock(R[n.contentType](props(n),ctx),n):`<div class="empty">No renderer for ${esc(n.contentType)}</div>`).join('');
  app.innerHTML=html; window.scrollTo(0,0);
}

/* ---------- search ---------- */
function runSearch(q){
  const box=$('#results'); q=q.trim().toLowerCase(); if(!q){box.classList.remove('show');return;}
  const m=(a)=>a.join(' ').toLowerCase().includes(q);
  const n=REG.news.map((x,i)=>[x,i]).filter(([x])=>m([x.Headline,x.Summary,x.Category]));
  const p=REG.people.map((x,i)=>[x,i]).filter(([x])=>m([x.FullName,x.JobTitle,x.Location,x.Bio]));
  const d=REG.docs.map((x,i)=>[x,i]).filter(([x])=>m([x.Title,x.Description]));
  const e=REG.events.map((x,i)=>[x,i]).filter(([x])=>m([x.Title,x.EventLocation]));
  let h='';
  if(n.length)h+='<h6>News</h6>'+n.map(([x,i])=>`<div class="it" data-act="news" data-v="${i}">${esc(x.Headline)}<small>${esc(CAT[x.Category])}</small></div>`).join('');
  if(p.length)h+='<h6>People</h6>'+p.map(([x,i])=>`<div class="it" data-act="person" data-v="${i}">${esc(x.FullName)}<small>${esc(x.JobTitle)} · ${esc(x.Location)}</small></div>`).join('');
  if(d.length)h+='<h6>Documents</h6>'+d.map(([x,i])=>`<div class="it" data-act="opendoc" data-v="${i}">${esc(x.Title)}<small>${esc(RTYPE[x.ResourceType])}</small></div>`).join('');
  if(e.length)h+='<h6>Events</h6>'+e.map(([x,i])=>`<div class="it" data-act="event" data-v="${i}">${esc(x.Title)}<small>${fmtDate(x.StartDate)}</small></div>`).join('');
  box.innerHTML=h||'<div class="it">No results</div>'; box.classList.add('show');
}

/* ---------- actions ---------- */
function eventModal(i){const e=REG.events[i];const going=S.rsvp.has(e.Title);
  modal(`<span class="tag ${e.EventType}">${esc(ETYPE[e.EventType]||e.EventType)}</span><h2 style="margin:10px 0 4px">${esc(e.Title)}</h2><p style="color:var(--mut);margin:0 0 12px">${fmtDate(e.StartDate,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · ${fmtTime(e.StartDate)}<br>📍 ${esc(e.EventLocation)}</p>${rich(e.Details)}
  ${e.RsvpEnabled?`<button class="btn" data-act="rsvp" data-v="${i}">${going?'Cancel RSVP':'RSVP - I will be there'}</button>`:'<p style="color:var(--mut)">No RSVP required.</p>'}`);}
function closeNeed(t){return !!t.closest('[data-act]');}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!e.target.closest('.search'))$('#results').classList.remove('show');
  if(e.target.id==='ov'){closeModal();return;} if(!t)return;
  const a=t.dataset.act,v=t.dataset.v; $('#results').classList.remove('show');
  if(a==='close')closeModal();
  else if(a==='newsf'){S.newsFilter=v;route();}
  else if(a==='news'){const x=REG.news[+v];modal(`<span class="tag ${x.Category}">${esc(CAT[x.Category])}</span><h2 style="margin:10px 0">${esc(x.Headline)}</h2><p style="color:var(--mut)">${esc(x.Summary)}</p>${rich(x.Body)||''}`);}
  else if(a==='person'){const x=REG.people[+v];modal(`<div class="person" style="margin-bottom:14px"><div class="av big">${initials(x.FullName)}</div><div><h2 style="margin:0">${esc(x.FullName)}</h2><div>${esc(x.JobTitle)}</div><small style="color:var(--mut)">${esc(x.Location)} · ${esc(DEPT[x.Department])}</small></div></div><p>${esc(x.Bio)}</p><p>✉️ ${esc(x.Email)}<br>📞 ${esc(x.Phone)}</p><button class="btn" data-act="msg" data-v="${v}">Message</button> <button class="btn ghost" data-act="shoutform" data-v="${v}">Recognize</button>`);}
  else if(a==='msg'){closeModal();toast(`Message sent to ${REG.people[+v].FullName}`);}
  else if(a==='shoutform'){const pre=v!==undefined?REG.people[+v].FullName:'';modal(`<h2 style="margin-top:0">Recognize a teammate</h2><div class="f"><label>Who?<select id="sh_to">${REG.people.map(p=>`<option ${p.FullName===pre?'selected':''}>${esc(p.FullName)}</option>`).join('')}</select></label><label>What did they do?<textarea id="sh_m" rows="3" placeholder="They went the second mile when..."></textarea></label><div class="err" id="sh_err"></div><div><button class="btn" data-act="shoutpost">Post shout-out</button></div></div>`);}
  else if(a==='shoutpost'){const m=$('#sh_m').value.trim();if(m.length<5){$('#sh_err').textContent='Please write a short message.';return;}S.shouts.unshift({to:$('#sh_to').value,from:'Jon Kee',msg:m,when:'Just now'});closeModal();const el=$('#shouts');if(el)el.innerHTML=shoutsHtml();toast('Shout-out posted. My pleasure!');}
  else if(a==='event')eventModal(+v);
  else if(a==='rsvp'){const ev=REG.events[+v];if(S.rsvp.has(ev.Title)){S.rsvp.delete(ev.Title);toast('RSVP cancelled');}else{S.rsvp.add(ev.Title);toast(`You're going to ${ev.Title}`);}eventModal(+v);}
  else if(a==='calprev'||a==='calnext'){S.cal=new Date(Date.UTC(S.cal.getUTCFullYear(),S.cal.getUTCMonth()+(a==='calnext'?1:-1),1));$('#calwrap').innerHTML=calHtml(REG.events);}
  else if(a==='addevent'){modal(`<h2 style="margin-top:0">Add event</h2><div class="f"><label>Title<input id="ae_t"></label><div class="two"><label>Date<input type="date" id="ae_d"></label><label>Time<input type="time" id="ae_h" value="10:00"></label></div><label>Location<input id="ae_l"></label><label>Type<select id="ae_y"><option value="company">Company</option><option value="training">Training</option><option value="community">Community</option><option value="celebration">Celebration</option></select></label><div class="err" id="ae_err"></div><div><button class="btn" data-act="saveevent">Add to calendar</button></div></div>`);}
  else if(a==='saveevent'){const ti=$('#ae_t').value.trim(),d=$('#ae_d').value;if(!ti||!d){$('#ae_err').textContent='Title and date are required.';return;}
    REG.events.push({Title:ti,EventType:$('#ae_y').value,StartDate:`${d}T${$('#ae_h').value||'10:00'}:00+00:00`,EventLocation:$('#ae_l').value||'TBD',Details:{html:'<p>Added by you for this demo.</p>'},RsvpEnabled:true});
    const pg=SITE.pages.find(p=>p.routeSegment==='events');pg.nodes[0].properties.Events.value=pg.nodes[0].properties.Events.value||pg.nodes[0].properties.Events;
    const arr=un(pg.nodes[0].properties.Events);arr.push({properties:REG.events[REG.events.length-1]});closeModal();route();toast('Event added');}
  else if(a==='train'){const d=REG.docs[+v];S.progress[d.Title]=Math.min(100,(S.progress[d.Title]||0)+35);route();toast(S.progress[d.Title]>=100?`${d.Title} complete! 🎉`:'Progress saved');}
  else if(a==='opendoc'){const d=REG.docs[+v];modal(`<span class="tag ${d.ResourceType}">${esc(RTYPE[d.ResourceType])}</span><h2 style="margin:10px 0">${esc(d.Title)}</h2><p>${esc(d.Description)}</p><p style="color:var(--mut)">Demo placeholder. In production this opens the media file linked in the CMS.</p>`);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q')runSearch(e.target.value);
  else if(e.target.id==='dirq'){S.dirQ=e.target.value;$('#dirgrid').innerHTML=dirGrid();}
  else if(e.target.id==='resq'){S.resQ=e.target.value;$('#resgrid').innerHTML=resGrid();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='dird'){S.dirDept=e.target.value;$('#dirgrid').innerHTML=dirGrid();}
  else if(e.target.id==='rest'){S.resType=e.target.value;$('#resgrid').innerHTML=resGrid();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='toform')return; e.preventDefault();
  const s=$('#to_s').value,en=$('#to_e').value,err=$('#to_err'),block=e.target.dataset.block==='1';
  const P=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);};
  if(!s||!en){err.textContent='Please choose a start and end date.';return;}
  const a=P(s),b=P(en),today=new Date();today.setHours(0,0,0,0);
  if(a<today){err.textContent='Start date cannot be in the past.';return;}
  if(b<a){err.textContent='End date must be on or after the start date.';return;}
  if(block&&(a.getDay()===0||b.getDay()===0)){err.textContent='We are closed on Sundays. Please choose a different start or end date.';return;}
  let days=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(d.getDay()!==0)days++;
  const hrs=days*8; if(hrs>S.hours){err.textContent=`This request needs ${hrs} hours but you only have ${S.hours} available.`;return;}
  err.textContent=''; S.hours-=hrs;
  const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  S.history.unshift({type:$('#to_type').value,range:s===en?`${f(a)}, ${a.getFullYear()}`:`${f(a)} - ${f(b)}, ${b.getFullYear()}`,hours:hrs,status:'Pending'});
  $('#hrs').textContent=S.hours;$('#tohist').innerHTML=histHtml();e.target.reset();toast('Request submitted to your operator');
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- boot ---------- */
async function loadPreview(token){
  const q=new URLSearchParams({key:PV.key,ver:PV.ver,loc:PV.loc,ctx:PV.ctx});
  const r=await fetch('/api/preview?'+q,{headers:Object.assign({Accept:'application/json'},token?{Authorization:'Bearer '+token}:{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||!j.home) throw new Error((j&&j.error)||('HTTP '+r.status));
  return j;
}
function setHeader(){const hp=props(SITE.home);$('#siteNameText').textContent=hp.SiteName||'The Coop';$('#restName').textContent=hp.RestaurantName||'';}
function previewBadge(){const p=SITE.preview;$('#srcBadge').textContent=`Preview: ${p.kind==='home'?'home':p.routeSegment} · version ${p.ver}${p.loc?' · '+p.loc:''} · ${p.ctx}`;}
function previewError(msg){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="empty">Preview unavailable: ${esc(msg)}</div>`;$('#srcBadge').textContent='Preview error';}
async function bootPreview(){
  // keep the short-lived token out of the address bar / history (it stays in memory for refreshes)
  const u=new URLSearchParams(location.search); u.delete('preview_token');
  history.replaceState(null,'',location.pathname+(u.toString()?'?'+u:'')+location.hash);
  try{ SITE=await loadPreview(PV.token); }
  catch(err){ previewError(err.message); return; } // never fall back to the snapshot: it would show the wrong content
  const p=SITE.preview;
  history.replaceState(null,'',location.pathname+location.search+(p.kind==='home'?'#/':'#/'+p.routeSegment));
  // On-page editing: load the CMS communication script from the CMS origin the server was configured with.
  if(PV.ctx==='edit'&&p.cmsOrigin&&/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(p.cmsOrigin)){
    const s=document.createElement('script'); s.src=p.cmsOrigin+'/util/javascript/communicationinjector.js'; document.head.appendChild(s);
  }
  // After each save the CMS sends a NEW version and a fresh 5-minute token: re-read and re-render.
  window.addEventListener('optimizely:cms:contentSaved',async e=>{
    const d=(e&&e.detail)||{}; let token=d.previewToken, ver=PV.ver;
    try{ const pu=new URL(d.previewUrl,location.href); token=token||pu.searchParams.get('preview_token'); ver=pu.searchParams.get('ver')||ver; }catch{}
    if(!token) return;
    try{ const prev=PV.ver; PV.ver=ver; PV.token=token; try{ SITE=await loadPreview(token); }catch(err){ PV.ver=prev; throw err; }
      setHeader(); buildRegistry(); route(); previewBadge(); }
    catch(err){ toast('Preview refresh failed: '+err.message); }
  });
  setHeader(); previewBadge(); buildRegistry(); route();
}
async function boot(){
  if(PV) return bootPreview();
  SITE=SNAPSHOT; let note='';
  if(CONFIG.contentUrl){
    try{
      const r=await fetch(CONFIG.contentUrl,{headers:{Accept:'application/json'}});
      const j=await r.json().catch(()=>null);
      if(!r.ok||!j||!j.home) throw new Error((j&&j.error)||('HTTP '+r.status));
      SITE=j;
    }catch(err){console.warn('Live content unavailable, using snapshot:',err);note=' (live content unavailable: '+err.message+')';SITE=SNAPSHOT;}
  }
  const hp=props(SITE.home);
  $('#siteNameText').textContent=hp.SiteName||'The Coop';$('#restName').textContent=hp.RestaurantName||'';
  $('#srcBadge').textContent='Content source: '+(SITE.source||'live')+note;
  buildRegistry();route();
}
boot();
</script>
